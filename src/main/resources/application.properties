server.port=8081

spring.application.name=ms-auth

# Lee el .env de la raiz del proyecto (el mismo que usa docker compose).
# En la nube no existe: ahi las variables las entrega el contenedor.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5434/auth_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Minimo 32 caracteres para HMAC-SHA256
app.jwt.secret=${JWT_SECRET}
# 8 horas en milisegundos
app.jwt.expiracion-ms=28800000

management.endpoints.web.exposure.include=health,info
