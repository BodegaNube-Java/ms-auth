server.port=8081

spring.application.name=ms-auth

spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/auth_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Minimo 32 caracteres para HMAC-SHA256
app.jwt.secret=${JWT_SECRET:e2kIlfDz1t76QYCLMKdwAyn4UK9WhcoFVs8wv66J0vR}
# 8 horas en milisegundos
app.jwt.expiracion-ms=28800000

management.endpoints.web.exposure.include=health,info